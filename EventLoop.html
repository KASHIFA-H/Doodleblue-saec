<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Loop</title>
</head>
<body>
    <script>
        // Event Loop: It ensures non-blocking execution by processing queued tasks when the call stack is empty.
        // callstack=synchronous code execution (javascript code executes by call stack)
        // microtask = gives the highest priority(then,catch outputs will go to webAPI, not promises)
        // webapi = settimeout timerhandlers, domevents, getch, add 
        console.log("start"); //microtask
        setTimeout(()=>console.log("Timer"),0); 
        Promise.resolve().then(()=>console.log("Promise"));
        console.log("Finish")
    </script>
</body>
</html>
